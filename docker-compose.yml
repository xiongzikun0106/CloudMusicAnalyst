services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cloudmusic-backend
    restart: always
    env_file:
      - .env
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LLM_ENABLED=${LLM_ENABLED:-1}
      - NCM_API_BASE=http://127.0.0.1:3000
      - CACHE_FILE=/app/data/cards_cache.db
    volumes:
      - cloudmusic-cache:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudmusic-frontend
    restart: always
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudmusic-tunnel
    restart: always
    command: tunnel --no-autoupdate run
    env_file:
      - .env
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend

volumes:
  cloudmusic-cache: